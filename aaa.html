<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>დიდგორი V18 - საბოლოო ვერსია</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --royal: #f1c40f; --win: #2ecc71; --loss: #e74c3c; }
        body { background: #050505; color: #eee; font-family: 'Courier New', monospace; }
        .war-room { border: 2px solid var(--royal); background: #111; border-radius: 10px; overflow: hidden; }
        #map { background: #1a1c1e; width: 100%; height: 350px; border-bottom: 2px solid var(--royal); }
        .stat-panel { background: #181818; padding: 15px; border-radius: 8px; border: 1px solid #333; }
        .console-box { height: 300px; overflow-y: auto; background: #000; padding: 15px; border: 1px solid #444; font-size: 0.95rem; }
        .btn-strat { background: transparent; color: var(--royal); border: 1px solid var(--royal); padding: 15px; margin-bottom: 12px; width: 100%; text-align: left; transition: 0.3s; font-weight: bold; }
        .btn-strat:hover:not([disabled]) { background: var(--royal); color: #000; }
        .msg-win { color: var(--win); border-left: 4px solid var(--win); padding-left: 10px; margin-bottom: 8px; }
        .msg-loss { color: var(--loss); border-left: 4px solid var(--loss); padding-left: 10px; margin-bottom: 8px; }
    </style>
</head>
<body>

<div class="container py-4">
    <div class="text-center mb-4">
        <h1 class="text-warning fw-bold">დიდგორი: ურღვევის ლოგიკა</h1>
    </div>

    <div class="war-room shadow-lg">
        <canvas id="map"></canvas>

        <div class="p-4">
            <div class="row g-3 mb-4 text-center">
                <div class="col-md-4">
                    <div class="stat-panel">
                        <small class="text-success fw-bold">ქართული ლაშქარი</small>
                        <h2 id="geo-army">56,000</h2>
                        <div class="progress" style="height:4px;"><div id="geo-bar" class="progress-bar bg-success" style="width: 100%"></div></div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stat-panel">
                        <small class="text-danger fw-bold">სელჩუკთა ურდო</small>
                        <h2 id="ene-army">300,000</h2>
                        <div class="progress" style="height:4px;"><div id="ene-bar" class="progress-bar bg-danger" style="width: 100%"></div></div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stat-panel">
                        <small class="text-info fw-bold">მორალი</small>
                        <h2 id="morale">100%</h2>
                        <div class="progress" style="height:4px;"><div id="moral-bar" class="progress-bar bg-info" style="width: 100%"></div></div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-lg-7">
                    <div id="console" class="console-box rounded">
                        <div style="color: #3498db;">[სისტემა]: ბრძოლა გრძელდება. სელჩუკების 0-ზე დაყვანა ნიშნავს მოგებას!</div>
                    </div>
                </div>
                <div class="col-lg-5">
                    <div id="actions"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let state = { geo: 56000, ene: 300000, morale: 100 };
    const canvas = document.getElementById('map');
    const ctx = canvas.getContext('2d');

    const actions = [
        { t: "200 მხედრის შეგზავნა", g: -200, e: -65000, msg: "მტრის სარდლობა პანიკაშია!" },
        { t: "ყივჩაღების იერიში", g: -1200, e: -55000, msg: "ყივჩაღებმა მტრის რიგები მოშალეს." },
        { t: "ნიჩბისის ხევში მომწყვდევა", g: -400, e: -60000, msg: "მტერი ხაფანგშია და იხოცება." },
        { t: "მეფე დავითის შეტევა", g: -1000, e: -75000, msg: "მეფე დავითი უძლეველია!" },
        { t: "საერთო შეტევა", g: -8000, e: -35000, msg: "მძიმე სისხლისღვრა ორივე მხარეს." }
    ];

    function drawMap() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#2d3436";
        ctx.beginPath(); ctx.moveTo(0, 40); ctx.lineTo(140, 180); ctx.lineTo(0, 320); ctx.fill();
        ctx.beginPath(); ctx.moveTo(canvas.width, 40); ctx.lineTo(canvas.width-140, 180); ctx.lineTo(canvas.width, 320); ctx.fill();

        ctx.fillStyle = "#2ecc71";
        let geoDots = Math.floor(state.geo / 2000);
        for(let i=0; i<Math.max(0, geoDots); i++) ctx.fillRect(160 + (i%12)*13, 230 + Math.floor(i/12)*13, 7, 7);

        ctx.fillStyle = "#e74c3c";
        let eneDots = Math.floor(state.ene / 6000);
        for(let i=0; i<Math.max(0, eneDots); i++) {
            ctx.beginPath(); ctx.arc(100 + (i%22)*15, 30 + Math.floor(i/22)*13, 4, 0, Math.PI*2); ctx.fill();
        }
    }

    function calculateMorale(geoLoss) {
        let lossEffect = (geoLoss / 1000) * 18; 
        state.morale = Math.max(0, Math.min(100, state.morale + lossEffect + 2)); 
    }

    function updateUI() {
        // მკაცრი ფიქსაცია: თუ რიცხვი 0-ზე ნაკლებია, გახდეს 0
        if (state.ene < 0) state.ene = 0;
        if (state.geo < 0) state.geo = 0;
        if (state.morale < 0) state.morale = 0;

        document.getElementById('geo-army').innerText = state.geo.toLocaleString();
        document.getElementById('ene-army').innerText = state.ene.toLocaleString();
        document.getElementById('morale').innerText = Math.round(state.morale) + "%";

        document.getElementById('geo-bar').style.width = (state.geo / 56000 * 100) + "%";
        document.getElementById('ene-bar').style.width = (state.ene / 300000 * 100) + "%";
        document.getElementById('moral-bar').style.width = state.morale + "%";

        // მომენტალური შემოწმება
        if (state.ene === 0) {
            endGame("გამარჯვება", "სელჩუკთა ჯარი განადგურდა! დიდგორი ჩვენია!");
            return true;
        } else if (state.geo === 0) {
            endGame("მარცხი", "ქართული ლაშქარი ბოლო მეომრამდე დაეცა...");
            return true;
        } else if (state.morale === 0) {
            endGame("დანებება", "ჯარი მორალურად გატყდა და იარაღი დაყარა.");
            return true;
        }
        return false;
    }

    function generate() {
        const p = document.getElementById('actions');
        p.innerHTML = '';
        let opts = [...actions].sort(() => 0.5 - Math.random()).slice(0, 3);
        opts.forEach(o => {
            const b = document.createElement('button');
            b.className = "btn-strat";
            b.innerHTML = `⚔️ ${o.t}`;
            b.onclick = () => {
                let prevMorale = state.morale;
                
                // ჯერ ვანგარიშობთ ახალ მნიშვნელობებს
                state.geo += o.g;
                state.ene += o.e;
                
                calculateMorale(o.g);

                const c = document.getElementById('console');
                let mDiff = Math.round(state.morale - prevMorale);
                c.innerHTML = `<div class="${mDiff >= 0 ? 'msg-win' : 'msg-loss'}">${o.msg} (მორალი: ${mDiff > 0 ? '+'+mDiff : mDiff}%)</div>` + c.innerHTML;
                
                // ვამოწმებთ დასრულდა თუ არა თამაში
                let isFinished = updateUI();
                drawMap();
                
                // თუ არ დასრულებულა, ვაჩვენებთ ახალ ღილაკებს
                if (!isFinished) generate();
            };
            p.appendChild(b);
        });
    }

    function endGame(title, message) {
        document.getElementById('actions').innerHTML = ""; // ვაქრობთ ღილაკებს
        
        // ვიყენებთ setTimeout-ს, რომ UI-მ მოასწროს 0-ის დაწერა ეკრანზე
        setTimeout(() => {
            document.body.innerHTML = `<div class="container py-5 text-center">
                <h1 class="display-1 fw-bold ${title === 'გამარჯვება' ? 'text-success' : 'text-danger'}">${title}</h1>
                <p class="lead my-4 fs-1 text-white">${message}</p>
                <button onclick="location.reload()" class="btn btn-warning btn-lg px-5 mt-3">ახალი ბრძოლა</button>
            </div>`;
        }, 100);
    }

    window.onload = () => {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
        drawMap();
        updateUI();
        generate();
    };
</script>
</body>
</html>
